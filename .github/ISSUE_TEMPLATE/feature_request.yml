name: ✨ Feature Request
description: Suggest a new idea for a specific app.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: app_name
    attributes:
      label: App Name
      description: Which app is this feature for?
      options:
        - alchemist
        - appstore
        - astronomy
        - calculator
        - calendar
        - camera
        - chess
        - clock
        - code
        - contacts
        - education
        - email
        - everysync
        - files
        - findfamily
        - fooddelivery
        - health
        - hub
        - keyboard
        - logicgate
        - maps
        - measure
        - messages
        - music
        - musicbrainz
        - notes
        - nowplaying
        - office
        - openassistant
        - passwords
        - pdf
        - photos
        - pipes
        - solitaire
        - speech
        - things
        - translate
        - travel
        - tuner
        - unblockjam
        - vpn
        - voxels
        - weather
        - web
        - wordmaker
        - youpipe
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature should be added and why is it important?
      placeholder: Describe the "what" and the "why" here.
    validations:
      required: true
