name: "✅ PR Compile Check"

on:
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change Gradle Wrapper Permissions
        run: chmod +x ./gradlew

      - name: Configure Gradle for CI runner
        run: |
          # GitHub-hosted Linux runners are ~16GB RAM / ~4 vCPU. The project's
          # local gradle.properties sizes the daemon at -Xmx46g, which cannot
          # start on a runner. GRADLE_USER_HOME (~/.gradle)/gradle.properties
          # overrides the project gradle.properties, so cap heap + workers to
          # runner-appropriate values here (leaves the local dev defaults alone).
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8'
            echo 'org.gradle.workers.max=2'
            echo 'kotlin.daemon.jvm.options=-Xmx2048m'
            echo 'android.compose.screenshot.maxHeapSize=2g'
          } >> ~/.gradle/gradle.properties
          echo "CI gradle overrides:" && cat ~/.gradle/gradle.properties

      - name: Check All Apps Compile
        run: ./gradlew :compileDevKotlin --max-workers=2
