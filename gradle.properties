# Heap sized for a full local assembleDev of all modules at once: with
# parallel=true and workers.max=4, several modules run mergeExtDex/D8
# concurrently in the same daemon heap, and 3584m was exhausted (D8 dex merge
# OutOfMemoryError). 6144m gives the concurrent D8 workers enough headroom.
# On 16GB CI runners, lower org.gradle.workers.max to 2 instead if memory is tight.
#
# MaxMetaspaceSize=1024m: the previous 512m cap was killing the daemon on
# release builds (R8 fullMode + lintVitalRelease + KSP + Kotlin compile all
# load class metadata into the same daemon's metaspace; with parallel=4 we
# easily blew past 512m).
org.gradle.jvmargs=-Xmx46144m -Xms4512m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx1536m

# Use more workers in parallel for multi-module compilation.
org.gradle.parallel=true
org.gradle.caching=true

# Modern defaults
kotlin.code.style=official

# Performance & Optimization
org.gradle.configuration-cache=true
android.enableR8.fullMode=true

# Preview Support (Remove once SDK 37 is stable)
android.suppressUnsupportedCompileSdk=37.0

# Compose Preview Screenshot Testing, used by common-conventions-preview-metadata to render
# store listing images from @Preview instead of from an instrumented test on a device.
# It has to live here rather than in the android {} block: the plugin reads it when it is
# applied, which is before any DSL has been configured. Modules that don't apply the plugin
# just get an empty screenshotTest source set, which costs nothing.
android.experimental.enableScreenshotTest=true

# Preview rendering is host-side and holds whole bitmaps in memory; the listing images are
# full-screen at xxhdpi (~1080x2340), so the default test-JVM heap is not enough.
android.compose.screenshot.maxHeapSize=4g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
