# Overlay config for the UWB (FiRa precision-finding) build. Not part of prj.conf so the
# BLE-only image is unaffected:
#
#   west build -b decawave_dwm3001cdk/nrf52833 firmware/findfamily-tracker \
#     -- -DEXTRA_CONF_FILE=uwb.conf \
#        -DZEPHYR_EXTRA_MODULES=<repo>/firmware/qorvo-uwb
#
# Requires the licensed Qorvo SDK via QORVO_SDK_DIR / QORVO_DRIVER_DIR. See README.md.

CONFIG_FF_TRACKER_UWB=y

# Zephyr log level for firmware/qorvo-uwb's own sources (3 = INF), so the SPI probe trace
# and the DW3110 init messages are visible. Note this is Zephyr's scale, where 2 would be
# warning — distinct from CONFIG_QORVO_UWB_QLOG_LEVEL, which is Qorvo's.
CONFIG_QORVO_UWB_LOG_LEVEL_INF=y

# Immediate rather than deferred logging for this build. Deferred output is flushed by a
# log thread, so an early crash loses everything queued — which presents as the boot banner
# (a direct printk) followed by silence, and hides the actual failure.
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y

# qosal allocates session state and frame buffers; firmware/qorvo-uwb routes those to
# k_malloc, so this pool has to cover them as well as normal kernel use — and now the MAC
# thread stacks too, since those are allocated from it.
CONFIG_HEAP_MEM_POOL_SIZE=24576

# Thread stacks for the Qorvo MAC are allocated at runtime. Its qmalloc returns pointers
# offset past a quota prefix, so the buffers it passes to qthread_create are byte-misaligned
# and unusable as Zephyr stacks; firmware/qorvo-uwb/src/qthread_zephyr.c ignores them and
# allocates properly instead, which needs these.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

# The Qorvo MAC runs its own threads and workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
