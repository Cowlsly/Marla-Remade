[package]
name = "wikidesc"
version = "0.1.0"
edition = "2021"

# DETACHED from both workspaces (the empty `[workspace]` table below), like every other host tool
# under `scripts/maps`: it is built for the host toolchain, not for Android.
[workspace]

[dependencies]
# For the `.pbf` scan only. The library half of this crate — cleaning, the container, the join —
# deliberately does not touch it, so it stays testable without an OSM extract.
osm_ingest = { path = "../osm_ingest" }

[lib]
name = "wikidesc"
path = "src/lib.rs"

[[bin]]
name = "wikidesc_build"
path = "src/bin/wikidesc_build.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
