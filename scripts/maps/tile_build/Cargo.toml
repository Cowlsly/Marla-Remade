# Host-side vector-tile build tools for the Maps basemap.
#
# Replaces `tippecanoe` and `tile-join`, which have no Windows path (see the note
# at `build_graph.ps1:29`) and would otherwise leave the `transit_stops` layer
# unbuildable on the dev box. This crate reads and writes MVT and PMTiles v3
# natively, so the whole tile chain is cargo-only.
#
# Deliberately DETACHED from the Android Rust workspace (the empty [workspace]
# table below), exactly like `scripts/maps/gtfs_ingest` and
# `scripts/maps/osm_ingest`: it is a host binary, so `cargo build` here never
# pulls the aarch64-android toolchain or the app crates' lints.
#
# Both dependencies are pure Rust and no C toolchain is involved:
#
#   miniz_oxide  inflate AND deflate. Unlike osm_ingest, this crate needs the
#                DEFLATE side too -- PMTiles gzips both its directories and its
#                tiles, so we compress as well as decompress.
#   rayon        the tilers' work-stealing pool. Level-9 DEFLATE inside
#                `pyramid::fit_tile` is where a layer build spends ~90% of its
#                wall clock, and it is per-tile pure, so it threads.
#
# `cargo build --offline` resolves both from the local registry cache, along with
# rayon's own tree (rayon-core, crossbeam-deque, crossbeam-utils, crossbeam-epoch,
# either). That is a statement about THIS box's cache, not a guarantee: a clean
# machine needs one online `cargo fetch` before it can build offline.
[package]
name = "tile_build"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "MVT + PMTiles v3 reader/writer for the Maps basemap (replaces tippecanoe/tile-join)"
[lib]
name = "tile_build"
path = "src/lib.rs"
[[bin]]
name = "tile_points"
path = "src/bin/tile_points.rs"
[[bin]]
name = "tile_lines"
path = "src/bin/tile_lines.rs"
[[bin]]
name = "tile_polygons"
path = "src/bin/tile_polygons.rs"
[[bin]]
name = "tile_join"
path = "src/bin/tile_join.rs"
[[bin]]
name = "pmtiles_dump"
path = "src/bin/pmtiles_dump.rs"
[[bin]]
name = "pmtiles_extract"
path = "src/bin/pmtiles_extract.rs"
[dependencies]
miniz_oxide = "0.8"
rayon = "1"
[profile.release]
opt-level = 3
# Detach from the repo-root workspace so this host tool builds standalone/offline.
[workspace]
