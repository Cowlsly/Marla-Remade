syntax = "proto2";option java_package = "com.vayunmathur.networklocation.proto";option java_outer_classname = "AppleWps";// Wire schema for Apple's location proxy (gs-loc.apple.com/clls/wloc), reconstructed// from the well-known GrapheneOS / community reverse-engineering of the protocol.//// A request carries only beacon identifiers (WiFi BSSIDs, cell ids) plus how many// results are wanted; the response echoes each identifier back with its location// filled in. One message type therefore serves both directions, mirroring Apple's// single "AppleWLoc" message.// Apple encodes coordinates as fixed-point integers of degrees * 1e8. A// horizontal_accuracy of -1 means "location unknown for this beacon".message BeaconLocation {  optional int64 latitude = 1;  optional int64 longitude = 2;  optional int32 horizontal_accuracy = 3;  optional int32 unknown4 = 4;  optional int32 altitude = 5;  optional int32 vertical_accuracy = 6;}message WifiDevice {  optional string bssid = 1;  optional BeaconLocation location = 2;}message CellTower {  optional int32 mcc = 1;  optional int32 mnc = 2;  optional int32 cell_id = 3;  optional int32 tac_or_lac = 4;  optional BeaconLocation location = 5;}message WifiPositioning {  repeated WifiDevice devices = 2;  optional int32 num_results = 3;}message CellPositioning {  repeated CellTower towers = 1;  optional int32 num_results = 2;}