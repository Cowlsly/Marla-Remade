[versions]

# =============================================================================
# GOOGLE / ANDROID / JETBRAINS
# =============================================================================

# Build & tooling
agp = "9.4.0-alpha04"
# lint version = 23 + AGP major (AGP 9.x -> lint 32.x)
lint = "32.4.0-alpha04"
kotlin = "2.4.0"
kotlinGradlePlugin = "2.3.20"
ksp = "2.3.10"
protobufPlugin = "0.10.0"
protoc = "4.28.3"
desugarJdkLibs = "2.1.5"

# Kotlin stdlib ecosystem (JetBrains)
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"

# AndroidX – core & lifecycle
coreKtx = "1.19.0"
fragmentKtx = "1.9.0-alpha02"
lifecycle = "2.11.0"
sqlite = "2.7.0"
workRuntimeKtx = "2.11.2"
datastorePreferences = "1.3.0-alpha09"

# AndroidX – Compose & UI
composeBom = "2026.06.01"
# Compose Preview Screenshot Testing (renders @Preview to PNG on the JVM, no device).
composeScreenshot = "0.0.1-alpha16"
activityCompose = "1.13.0"
material3 = "1.5.0-alpha23"
material3AdaptiveNavigationSuite = "1.5.0-alpha23"
foundation = "1.12.0-beta02"
wearComposeMaterial = "1.7.0-alpha05"
# TV Material: Material Design for a ten-foot UI, where Material 3's focus handling does not reach.
tv = "1.1.0"

# AndroidX – navigation
navigation3 = "1.2.0-alpha05"
adaptiveNavigation3 = "1.3.0-rc01"

# AndroidX – media, camera & images
media3Exoplayer = "1.11.0-beta01"
camerax = "1.7.0-alpha02"
exifinterface = "1.4.2"

# AndroidX – storage
room = "2.8.4"

# AndroidX – widgets, web & browser
glance = "1.3.0-alpha02"
webkit = "1.17.0-alpha03"
browser = "1.9.0"

# AndroidX – security, identity & health
biometric = "1.4.0-alpha07"
credentials = "1.7.0-alpha02"
autofill = "1.3.0"
connectClient = "1.2.0-alpha04"

# AndroidX – ink
ink = "1.1.0-alpha04"

# Google libraries
protobuf = "4.36.0-RC1"
protobufJavalite = "4.35.0"
# gRPC for the Accrescent app source (:appstore). grpc-java + grpc-kotlin coroutine stubs
# over grpc-okhttp; the messages are generated as protobuf-lite to match the repo's other
# protobuf module (:networklocation). These versions must stay mutually compatible with
# protobufJavalite above and are the most likely first build-friction point.
grpc = "1.69.0"
grpcKotlin = "1.4.1"
# BouncyCastle: ed25519 verification of Accrescent's signify-signed repodata (:appstore).
bouncycastle = "1.79"
# @javax.annotation.Generated referenced by grpc-java generated stubs.
javaxAnnotation = "1.3.2"
jsr305 = "3.0.2"
zxing = "3.5.4"
libphonenumber = "9.0.34"
litertlmAndroid = "0.14.0"
brotli = "0.1.2"
# Zstandard JNI bindings (com.github.luben) for the offline geocoder block codec.
zstdJni = "1.5.6-9"
# Standalone library from the AGP toolchain (com.android.tools.build), not the plugin —
# :appstore uses it at runtime to verify APK source stamps.
apksig = "8.7.3"

# =============================================================================
# THIRD PARTY
# =============================================================================

# Maps & geospatial
maplibre = "0.13.0"
flatgeobuf = "3.29.0"

# JavaScript engines & HTML
quickjs = "1.0.5"

# Git
jgit = "6.10.1.202505221210-r"

# On-device AI
onnxruntimeAndroid = "1.27.0"
# Reduced-operator rebuild of the above, arm64-only. Version tracks upstream plus an -rN
# suffix for the operator-set revision, so a rebuild with different ops gets a new version.
onnxruntimeReduced = "1.27.0-r1"

# Crypto, security & credential storage
cryptographyCore = "0.6.0"
sqlcipherAndroid = "4.17.0"
# Pinned at 0.101.0, not Maven Central's newest (0.86.5): the CDSI enclave identity is compiled into the
# native library, and 0.86.5/0.92.0 carry a retired MRENCLAVE, so contact discovery requests
# /v1/{stale}/discovery and the server answers 404. 0.101.0 also matches the checked-out libsignal source,
# which keeps its API verifiable. Published by Signal, not Maven Central.
libsignalAndroid = "0.101.0"
# Signal's WebRTC fork plus its calling engine. Bundles its own org.webrtc, so it cannot coexist with
# another WebRTC distribution in the same APK.
ringrtcAndroid = "2.71.0"
# signalProtocolJava removed — WhatsApp X3DH now via Rust libwhatsapp_signal

# XML
kxml2 = "2.3.0"

# Payments, telephony & auth
stripe = "21.12.0"
appauth = "0.11.1"

# Own libraries (vayun-mathur, via JitPack)
stockfishLibrary = "1.1.0"
ncnnAndroid = "1.8.0"

# AppStore – Play install via Aurora
gplayapi = "3.6.4"

# Google Voice virtual line (:communicate) — maintained prebuilt WebRTC (org.webrtc.*)
# for the calling audio session. HTTP + SIP WebSocket reuse :library:network (no OkHttp).
streamWebrtc = "1.3.8"

[libraries]

# =============================================================================
# GOOGLE / ANDROID / JETBRAINS
# =============================================================================

# Gradle plugin artifacts (build-logic classpath)
gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
# Lint check API. Versioned off AGP: lint ships as 23 + the AGP major.
lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }
lint-checks = { module = "com.android.tools.lint:lint-checks", version.ref = "lint" }
# Needed on build-logic's classpath so common-conventions-preview-metadata can apply it by id.
compose-screenshot-gradle = { module = "com.android.compose.screenshot:screenshot-test-gradle-plugin", version.ref = "composeScreenshot" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinGradlePlugin" }
kotlin-compose-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
symbol-processing-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Kotlin stdlib ecosystem (JetBrains)
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# Stripe compiles against kotlin-parcelize but doesn't publish the runtime as a POM
# dependency, so consumers must add it themselves. See :fooddelivery.
kotlin-parcelize-runtime = { group = "org.jetbrains.kotlin", name = "kotlin-parcelize-runtime", version.ref = "kotlinGradlePlugin" }

# AndroidX – core & lifecycle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# AndroidX – Compose & UI (unversioned entries come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Supplies @PreviewTest, which is what actually marks a @Preview as a screenshot test.
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "composeScreenshot" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
# Only a transitive dependency otherwise; :launcher declares it directly for animateBounds and Animatable.
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3AdaptiveNavigationSuite" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearComposeMaterial" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearComposeMaterial" }
# No `tv-foundation` companion: it was deprecated at 1.0.0 and its lazy lists moved into
# `androidx.compose.foundation`, which the Compose BOM above already provides. Pinning the abandoned
# artifact would drag compose 1.6 into the resolution for components nothing here uses.
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv" }

# AndroidX – navigation
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-compose-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "adaptiveNavigation3" }

# AndroidX – Media3 (ExoPlayer & session)
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3Exoplayer" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3Exoplayer" }
androidx-media3-ui-compose-material3 = { module = "androidx.media3:media3-ui-compose-material3", version.ref = "media3Exoplayer" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3Exoplayer" }
androidx-media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3Exoplayer" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3Exoplayer" }

# AndroidX – CameraX & images
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
androidx-camera-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "camerax" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# AndroidX – Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# AndroidX – app widgets (Glance)
androidx-glance = { module = "androidx.glance:glance", version.ref = "glance" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

# AndroidX – web & browser
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# AndroidX – security, identity & health
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-credentials-lib = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
androidx-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "connectClient" }

# AndroidX – ink
androidx-ink-authoring = { group = "androidx.ink", name = "ink-authoring", version.ref = "ink" }
androidx-ink-brush = { group = "androidx.ink", name = "ink-brush", version.ref = "ink" }
androidx-ink-geometry = { group = "androidx.ink", name = "ink-geometry", version.ref = "ink" }
androidx-ink-strokes = { group = "androidx.ink", name = "ink-strokes", version.ref = "ink" }
androidx-ink-rendering = { group = "androidx.ink", name = "ink-rendering", version.ref = "ink" }

# Google libraries
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobufJavalite" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobufJavalite" }
# gRPC runtime + codegen (:appstore Accrescent source)
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
grpc-protoc-gen-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpcKotlin" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javaxAnnotation" }
google-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlmAndroid" }
brotli-dec = { module = "org.brotli:dec", version.ref = "brotli" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }

# =============================================================================
# THIRD PARTY
# =============================================================================

# Maps & geospatial
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre" }
flatgeobuf = { module = "org.wololo:flatgeobuf", version.ref = "flatgeobuf" }

# JavaScript engines & HTML
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }

# Git
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }

# On-device AI
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntimeAndroid" }
# Same source as onnxruntime-android, built with --include_ops_by_config for exactly the
# operators whisper-tiny (speech) and TinyCLIP (photos) need: 10 MB of native code instead of
# 28 MB. Only those two apps may use it — a model with an operator outside the configured set
# fails at session creation, not at inference. openassistant stays on the full build.
onnxruntime-reduced = { module = "io.github.vayun-mathur:onnxruntime-reduced-android", version.ref = "onnxruntimeReduced" }

# Crypto, security & credential storage
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptographyCore" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptographyCore" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipherAndroid" }
libsignal-android = { module = "org.signal:libsignal-android", version.ref = "libsignalAndroid" }
ringrtc-android = { module = "org.signal:ringrtc-android", version.ref = "ringrtcAndroid" }

# XML
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

# Payments, telephony & auth
stripe-android = { module = "com.stripe:stripe-android", version.ref = "stripe" }
appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }

# Own libraries (vayun-mathur, via JitPack)
stockfish-library = { module = "com.github.vayun-mathur:Stockfish-Library", version.ref = "stockfishLibrary" }
ncnn-android = { module = "com.github.vayun-mathur:ncnn-android", version.ref = "ncnnAndroid" }

# AppStore – Play install via Aurora
auroraoss-gplayapi = { module = "com.auroraoss:gplayapi", version.ref = "gplayapi" }

# Google Voice virtual line (:communicate)
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "streamWebrtc" }

[plugins]

# =============================================================================
# GOOGLE / ANDROID / JETBRAINS
# =============================================================================

# Android & Kotlin
android-application = { id = "com.android.application", version.ref = "agp" }
compose-screenshot = { id = "com.android.compose.screenshot", version.ref = "composeScreenshot" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
